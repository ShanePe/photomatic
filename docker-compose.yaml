version: "3.9"

services:
  photomatic:
    image: shanepenn/photomatic:latest
    container_name: photomatic
    hostname: photomatic
    domainname: home.lan
    working_dir: /app
    tty: true
    stdin_open: true

    environment:
      LANG: C.UTF-8
      FLASK_ENV: production
      PORT: 80
      CONFIG_FILE: /etc/photomatic/config.yaml
      APP_SECRET_KEY: ${APP_SECRET_KEY}

    volumes:
      - /mnt/Photos:/photos
      - /mnt/Cache/photomatic:/cache
      - /mnt/Logs/photomatic:/logs
      - /opt/healthcheck:/healthcheck
      - /opt/photomatic/config.yaml:/etc/photomatic/config.yaml

    restart: unless-stopped
