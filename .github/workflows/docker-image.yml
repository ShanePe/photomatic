name: Docker Image CI

on:
  push:
    branches: ['master']
  pull_request:
    branches: ['master']

env:
  CONT: photomatic

permissions:
  contents: write

jobs:
  build-and-push:
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.bump.outputs.version }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Bump patch version
        id: bump
        run: |
          if [[ ! -f VERSION ]]; then
            echo "VERSION file missing"
            exit 1
          fi

          CURRENT=$(tr -d '[:space:]' < VERSION)
          IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT"

          if [[ -z "$MAJOR" || -z "$MINOR" || -z "$PATCH" ]]; then
            echo "Invalid semantic version in VERSION: $CURRENT"
            exit 1
          fi

          NEXT="$MAJOR.$MINOR.$((PATCH + 1))"
          echo "$NEXT" > VERSION

          echo "version=$NEXT" >> "$GITHUB_OUTPUT"

      - name: Commit bumped version
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add VERSION
          git commit -m "chore: bump version to ${{ steps.bump.outputs.version }} [skip ci]"
          git push

      - name: Validate required secrets
        run: |
          if [[ -z "${{ secrets.DOCKERHUB_USERNAME }}" ]]; then
            echo "DOCKERHUB_USERNAME is empty"
            exit 1
          fi

          if [[ -z "${{ secrets.DOCKERHUB_TOKEN }}" ]]; then
            echo "DOCKERHUB_TOKEN is empty"
            exit 1
          fi

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build Docker image
        run: |
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.CONT }}:${{ steps.bump.outputs.version }} .
          docker tag ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.CONT }}:${{ steps.bump.outputs.version }} ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.CONT }}:latest

      - name: Push Docker image
        run: |
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.CONT }}:${{ steps.bump.outputs.version }}
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.CONT }}:latest

  redeploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'

    steps:
      - name: Trigger Portainer redeploy webhook
        run: |
          HOOK="${{ secrets.PORTAINER_WEBHOOK }}"
          IMAGE="${{ secrets.DOCKERHUB_USERNAME }}/${{ env.CONT }}:${{ needs['build-and-push'].outputs.version }}"
          JSON="{\"image\":\"${IMAGE}\",\"metadata\":{\"ctn_names\":\"${{ env.CONT }}\"}}"

          if [[ -z "$HOOK" ]]; then
            echo "PORTAINER_WEBHOOK is empty"
            exit 1
          fi

          if [[ -z "$IMAGE" ]]; then
            echo "Image output is empty"
            exit 1
          fi

          echo "Redeploying stack with payload: $JSON"

          STATUS=$(curl -sS -o /dev/null -w "%{http_code}" \
            -H "Content-Type: application/json" \
            -d "$JSON" \
            "$HOOK")

          echo "HTTP status: $STATUS"

          if [[ "$STATUS" -lt 200 || "$STATUS" -ge 300 ]]; then
            echo "Redeploy failed"
            exit 1
          fi

          echo "Redeploy successful"
