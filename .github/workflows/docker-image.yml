name: Docker Image CI

on:
  push:
    branches: ['master']
  pull_request:
    branches: ['master']

env:
  CONT: photomatic

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.14', '3.15']
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run pytest tests
        id: run-tests
        run: |
          pytest tests/ -v --tb=short

      - name: Test result summary
        if: always()
        env:
          TEST_OUTCOME: ${{ steps.run-tests.outcome }}
        run: |
          if [[ "$TEST_OUTCOME" == "success" ]]; then
            echo "✅ Tests passed successfully." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "❌ Tests did not pass (outcome: $TEST_OUTCOME)." >> "$GITHUB_STEP_SUMMARY"
          fi

  build-and-push:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.bump.outputs.version }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Bump patch version
        id: bump
        run: |
          if [[ ! -f VERSION ]]; then
            echo "VERSION file missing"
            exit 1
          fi

          CURRENT=$(tr -d '[:space:]' < VERSION)
          IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT"

          if [[ -z "$MAJOR" || -z "$MINOR" || -z "$PATCH" ]]; then
            echo "Invalid semantic version in VERSION: $CURRENT"
            exit 1
          fi

          NEXT="$MAJOR.$MINOR.$((PATCH + 1))"
          echo "$NEXT" > VERSION

          echo "version=$NEXT" >> "$GITHUB_OUTPUT"

      - name: Commit bumped version
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add VERSION
          git commit -m "chore: bump version to ${{ steps.bump.outputs.version }} [skip ci]"
          git push --quiet

      - name: Validate required secrets
        run: |
          if [[ -z "${{ secrets.DOCKERHUB_USERNAME }}" ]]; then
            echo "DOCKERHUB_USERNAME is empty"
            exit 1
          fi

          if [[ -z "${{ secrets.DOCKERHUB_TOKEN }}" ]]; then
            echo "DOCKERHUB_TOKEN is empty"
            exit 1
          fi

      - name: Log in to Docker Hub
        uses: docker/login-action@v4.8.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build Docker image
        run: |
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.CONT }}:${{ steps.bump.outputs.version }} .
          docker tag ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.CONT }}:${{ steps.bump.outputs.version }} ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.CONT }}:latest

      - name: Push Docker image
        run: |
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.CONT }}:${{ steps.bump.outputs.version }}
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.CONT }}:latest

  redeploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    permissions: {}

    steps:
      - name: Trigger Portainer redeploy webhook
        run: |
          HOOK="${{ secrets.PORTAINER_WEBHOOK }}"
          IMAGE="${{ secrets.DOCKERHUB_USERNAME }}/${{ env.CONT }}:${{ needs['build-and-push'].outputs.version }}"
          JSON="{\"image\":\"${IMAGE}\",\"metadata\":{\"ctn_names\":\"${{ env.CONT }}\"}}"

          if [[ -z "$HOOK" ]]; then
            echo "PORTAINER_WEBHOOK is empty"
            exit 1
          fi

          if [[ -z "$IMAGE" ]]; then
            echo "Image output is empty"
            exit 1
          fi

          echo "Redeploying stack with payload: $JSON"

          STATUS=$(curl -sS -o /dev/null -w "%{http_code}" \
            -H "Content-Type: application/json" \
            -d "$JSON" \
            "$HOOK")

          echo "HTTP status: $STATUS"

          if [[ "$STATUS" -lt 200 || "$STATUS" -ge 300 ]]; then
            echo "Redeploy failed"
            exit 1
          fi

          echo "Redeploy successful"
